plugins {
    id 'java'
}

group = 'org.yggdracity'
version = rootProject.ext.componentVersion

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':yggdracity-core')
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
